# radperf configuration
log_level: "info"

# number of parallel connections; each connection gets its own UDP socket
# and keeps one request in flight at a time
connections: 100

# how long to wait for a response before the request counts as failed
timeout: "2s"

# per-connection stats are printed every interval
interval: "1s"

auth:
  # RADIUS server to test (ip:port)
  server: "<IP>:1812"
  # shared secret -- keep this file private!
  secret: "<secret>"
  username: "radtest"
  password: "<secret>"
  # optional; remove the line or set to null to omit the attribute
  # nas_identifier: "test"
  # AccessRequest or AccountingRequest
  packet_type: "AccessRequest"
  # "pap" (default, like radtest) or "mschapv2" (like radtest -t mschap)
  method: "pap"

# accounting: only used when auth.packet_type is AccountingRequest
accounting:
  # start / interim / stop flood that single record type as fast as possible;
  # cycle (default) simulates full sessions: Start -> paced Interim-Update
  # every interim_interval -> Stop after session_length, then a new session
  status_type: "cycle"
  interim_interval: "10s"
  session_length: "5m"
  # Called-Station-Id, e.g. "02-00-00-00-00-01:eduroam"; omitted when unset
  # called_station_id: "02-00-00-00-00-01:eduroam"
  # fixed Framed-IP-Address for all sessions; random 10.x.y.z per session otherwise
  # framed_ip: "10.0.0.1"
